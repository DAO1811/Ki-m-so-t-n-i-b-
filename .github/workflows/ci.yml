name: Application checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dhd_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dhd_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dhd_ci
      SECRET_KEY: ci-only-test-key-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in static/*.js; do
            node --check "$file"
          done
      - name: Check stylesheet bundle
        run: python scripts/build_styles.py --check
      - name: Check Django configuration
        run: python manage.py check
      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test against isolated PostgreSQL
        run: python manage.py test --noinput
      - name: Validate production static assets
        run: python manage.py collectstatic --noinput
