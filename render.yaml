# Test-only branch. Do not merge this deployment file into production main.
services:
  - type: web
    name: dhd-ksnb-test
    runtime: python
    plan: free
    region: singapore
    branch: preview/dhd-live-test
    autoDeployTrigger: 'off'
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dhd-ksnb-test-db
          property: connectionString
      - key: INITIAL_ADMIN_USERNAME
        value: admin_test
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: dhd-ksnb-test-db
    databaseName: dhd_ksnb_test
    plan: free
    region: singapore
    ipAllowList: []
