{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><div class="eyebrow">NGHIỆP VỤ KHO</div><h1>Chứng từ kho</h1><p>Nhập, xuất, chuyển, mượn trả, kiểm kê và điều chỉnh tồn.</p></div>{% if perms.inventory.add_document %}<a href="/import/receipt/" class="button secondary">↑ Nhập Excel</a> <a href="/documents/new/" class="button">＋ Tạo chứng từ</a>{% endif %}</div><form class="filters"><select name="kind"><option value="">Tất cả nghiệp vụ</option>{% for value,label in kinds %}<option value="{{ value }}" {% if request.GET.kind == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><select name="status"><option value="">Mọi trạng thái</option><option value="DRAFT" {% if request.GET.status == 'DRAFT' %}selected{% endif %}>Nháp</option><option value="TRANSIT" {% if request.GET.status == 'TRANSIT' %}selected{% endif %}>Đang chuyển / chờ nhận</option><option value="POSTED" {% if request.GET.status == 'POSTED' %}selected{% endif %}>Đã ghi sổ</option></select><button>Lọc chứng từ</button></form><div class="panel">{% include 'document_table.html' %}</div><p class="hint">Hiển thị tối đa 200 phiếu gần nhất.</p>{% endblock %}
