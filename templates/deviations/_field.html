<div class="field deviation-field {% if field.widget_type == 'checkbox' %}deviation-check{% endif %}">
  {{ field.label_tag }}{% if field.field.required %}<span class="required" aria-hidden="true">*</span>{% endif %}
  {{ field }}{% if field.help_text %}<small class="helptext">{{ field.help_text }}</small>{% endif %}{{ field.errors }}
</div>
